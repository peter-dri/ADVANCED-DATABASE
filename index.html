<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My School Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My School Register</h1>

  <form id="myForm">

    <p class="label">I am a</p>
    <label class="radio">
      <input type="radio" name="role" value="Student" required> Student
    </label>
    <label class="radio">
      <input type="radio" name="role" value="Lecturer" required> Lecturer
    </label>

    <label for="name">Name</label>
    <input id="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" type="text">

    <label for="course">Course (students) or Department (lecturers)</label>
    <input id="course" type="text">

    <button type="submit">Save</button>

    <!-- Messages appear here: green if it worked, red if it did not. -->
    <p id="message"></p>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>

</body>
</html>
