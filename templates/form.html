<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Registration</h1>
    <p class="subtitle">Register as a student or a lecturer.</p>

    {% if errors %}
      <div class="errors">
        <strong>Please fix the following:</strong>
        <ul>
          {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="post" action="/">
      <fieldset class="roles">
        <legend>I am a</legend>
        <label class="radio">
          <input type="radio" name="role" value="student" required
                 {% if form.get('role') == 'student' %}checked{% endif %}>
          Student
        </label>
        <label class="radio">
          <input type="radio" name="role" value="lecturer" required
                 {% if form.get('role') == 'lecturer' %}checked{% endif %}>
          Lecturer
        </label>
      </fieldset>

      <label for="full_name">Full Name</label>
      <input id="full_name" name="full_name" type="text" required
             value="{{ form.get('full_name', '') }}">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required
             value="{{ form.get('email', '') }}">

      <label for="phone">Phone <span class="hint">(optional)</span></label>
      <input id="phone" name="phone" type="text"
             value="{{ form.get('phone', '') }}">

      <fieldset id="student-fields" class="role-fields" hidden>
        <legend>Student details</legend>

        <label for="reg_no">Registration Number</label>
        <input id="reg_no" name="reg_no" type="text"
               value="{{ form.get('reg_no', '') }}">

        <label for="course">Course</label>
        <input id="course" name="course" type="text"
               value="{{ form.get('course', '') }}">

        <label for="year_of_study">Year of Study</label>
        <select id="year_of_study" name="year_of_study">
          <option value="">Select a year</option>
          {% for year in range(1, 7) %}
            <option value="{{ year }}"
              {% if form.get('year_of_study') == year|string %}selected{% endif %}>
              {{ year }}
            </option>
          {% endfor %}
        </select>
      </fieldset>

      <fieldset id="lecturer-fields" class="role-fields" hidden>
        <legend>Lecturer details</legend>

        <label for="staff_no">Staff Number</label>
        <input id="staff_no" name="staff_no" type="text"
               value="{{ form.get('staff_no', '') }}">

        <label for="department">Department</label>
        <input id="department" name="department" type="text"
               value="{{ form.get('department', '') }}">
      </fieldset>

      <button type="submit">Register</button>
    </form>

    <p class="footer-link"><a href="/records">View saved records &rarr;</a></p>
  </main>

  <script>
    // Show only the selected role's fieldset, and make its inputs required
    // so the browser does not demand values for the hidden role.
    var sections = {
      student: document.getElementById('student-fields'),
      lecturer: document.getElementById('lecturer-fields')
    };

    function showRole(role) {
      Object.keys(sections).forEach(function (name) {
        var section = sections[name];
        var active = name === role;
        section.hidden = !active;
        section.querySelectorAll('input, select').forEach(function (field) {
          if (active) {
            field.setAttribute('required', '');
          } else {
            field.removeAttribute('required');
          }
        });
      });
    }

    document.querySelectorAll('input[name="role"]').forEach(function (radio) {
      radio.addEventListener('change', function () { showRole(this.value); });
    });

    // On a re-render after an error, reopen the role the user had picked.
    var checked = document.querySelector('input[name="role"]:checked');
    if (checked) { showRole(checked.value); }
  </script>
</body>
</html>
